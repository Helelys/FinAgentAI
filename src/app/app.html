<!-- Toast Notification -->
<app-toast />

<!-- Modal de Confirmação Customizado -->
<app-confirm-dialog />

<!-- Modal Detalhes da Fatura -->
<app-invoice-detail-modal />

<!-- Layout Principal -->
<div class="min-h-screen flex flex-col lg:flex-row">
  <!-- Sidebar / Topbar Navegação -->
  <app-sidebar />

  <!-- Área de Conteúdo Principal -->
  <main class="flex-1 min-w-0 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
    <!-- Header Contextual -->
    <app-header />

    <!-- Conteúdo Dinâmico por Aba -->
    @switch (uiService.activeTab()) {
      @case ('dashboard') {
        <app-dashboard />
      }
      @case ('upload') {
        <app-invoice-upload />
      }
      @case ('invoices') {
        <app-invoice-list />
      }
      @case ('advisor') {
        <app-ai-advisor />
      }
    }
  </main>
</div>
